# docker-compose.golden.yml
# Entorno puro de producción/calidad. Sin Chaos Testing ni Mocks.

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./:/app
    - sqlite_data:/app/infra/db
    - hf_models_cache:/app/.cache/hf
    - torch_cache:/app/.cache/torch
    - tectonic_cache:/app/.cache/tectonic
  restart: unless-stopped
  init: true
  environment:
    PYTHONPATH: /app
    APP_ROOT: /app
    FSM_DB_PATH: /app/infra/db/fsm.db
    QUEUE_DB_PATH: /app/infra/db/queue.db
    XDG_CACHE_HOME: /app/.cache
    HF_HOME: /app/.cache/hf
    TORCH_HOME: /app/.cache/torch
    TECTONIC_CACHE_DIR: /app/.cache/tectonic
    ENABLE_CHAOS_TEST: "0"
    IS_BENCHMARK: "0"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  llm_worker:
    environment:
      ENABLE_CHAOS_TEST: "0"
      IS_BENCHMARK: "0"
      MAX_CONCURRENT_CHUNKS: "1"
      MAX_GLOBAL_LLM_CONCURRENCY: "1"
      GEMINI_API_URL: "https://generativelanguage.googleapis.com"
      GEMINI_API_KEY: ${GEMINI_API_KEY}

  assembler:
    environment:
      ENABLE_CHAOS_TEST: "0"
volumes:
  sqlite_data:
  hf_models_cache:
  torch_cache:
  tectonic_cache: