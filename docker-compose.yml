x-worker-base: &worker-base
  build:
    context: .
    dockerfile: Dockerfile

  volumes:
    - ./:/app
    - sqlite_data:/app/infra/db

    # CACHES PERSISTENTES SOTA
    - hf_models_cache:/app/.cache/hf
    - torch_cache:/app/.cache/torch
    - tectonic_cache:/app/.cache/tectonic

  networks:
    - chaos_net

  restart: unless-stopped
  init: true

  stop_grace_period: 30s

  pids_limit: 256

  ulimits:
    nofile:
      soft: 65535
      hard: 65535

  environment:
    PYTHONPATH: /app
    APP_ROOT: /app

    # PATHS ABSOLUTOS SOTA
    FSM_DB_PATH: /app/infra/db/fsm.db
    QUEUE_DB_PATH: /app/infra/db/queue.db

    # CACHE UNIFICADO
    XDG_CACHE_HOME: /app/.cache
    HF_HOME: /app/.cache/hf
    TRANSFORMERS_CACHE: /app/.cache/hf
    HUGGINGFACE_HUB_CACHE: /app/.cache/hf
    TORCH_HOME: /app/.cache/torch
    TECTONIC_CACHE_DIR: /app/.cache/tectonic

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # --- INIT CONTAINER SOTA DE INFRAESTRUCTURA ---
  db_bootstrap:
    <<: *worker-base
    command: ["python", "infra/db/bootstrap.py"]

    mem_limit: 256m
    cpus: "0.5"

    depends_on: []

    restart: "no"

  # --- DAEMONS OPERATIVOS ---
  reconciler:
    <<: *worker-base
    command: ["python", "apps/daemons/reconciler.py"]

    mem_limit: 512m
    cpus: "0.5"

    depends_on:
      db_bootstrap:
        condition: service_completed_successfully

    environment:
      PYTHONPATH: /app
      APP_ROOT: /app

      FSM_DB_PATH: /app/infra/db/fsm.db
      QUEUE_DB_PATH: /app/infra/db/queue.db

      NODE_ID: reconciler_alpha
      GEMINI_API_URL: http://toxiproxy:8443

  # --- NUEVA ARQUITECTURA DISTRIBUIDA CON AISLAMIENTO REAL ---
  ocr_router:
    <<: *worker-base
    command: ["python", "apps/ocr_router/__main__.py"]

    mem_limit: 10g
    memswap_limit: 12g
    cpus: "2.0"

    depends_on:
      db_bootstrap:
        condition: service_completed_successfully

    environment:
      PYTHONPATH: /app
      APP_ROOT: /app

      FSM_DB_PATH: /app/infra/db/fsm.db
      QUEUE_DB_PATH: /app/infra/db/queue.db

      NODE_ID: ocr_router_alpha

      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

  llm_worker:
    <<: *worker-base
    command: ["python", "runtime/engine.py"]

    mem_limit: 6g
    cpus: "3.0"
    memswap_limit: 10g

    depends_on:
      toxiproxy:
        condition: service_healthy

      db_bootstrap:
        condition: service_completed_successfully

    environment:
      PYTHONPATH: /app
      APP_ROOT: /app

      FSM_DB_PATH: /app/infra/db/fsm.db
      QUEUE_DB_PATH: /app/infra/db/queue.db

      NODE_ID: llm_worker_alpha

      GEMINI_API_URL: http://toxiproxy:8443

      MAX_CONCURRENT_CHUNKS: 4
      MAX_GLOBAL_LLM_CONCURRENCY: 4

      GEMINI_API_KEY: dummy_sre_key_para_fake_gemini

      ENABLE_CHAOS_TEST: "0"
      IS_BENCHMARK: "1"

  assembler:
    <<: *worker-base
    command: ["python", "apps/compiler/__main__.py"]

    mem_limit: 2g
    cpus: "1.5"
    memswap_limit: 10gb

    depends_on:
      db_bootstrap:
        condition: service_completed_successfully

    environment:
      PYTHONPATH: /app
      APP_ROOT: /app

      FSM_DB_PATH: /app/infra/db/fsm.db
      QUEUE_DB_PATH: /app/infra/db/queue.db

      NODE_ID: assembler_alpha

  sweeper:
    <<: *worker-base
    command: ["python", "runtime/sweeper.py"]

    mem_limit: 256m
    cpus: "0.2"

    depends_on:
      db_bootstrap:
        condition: service_completed_successfully

  # --- INFRAESTRUCTURA DE CAOS ---
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.5.0

    command:
      - "-host"
      - "0.0.0.0"
      - "-config"
      - "/config/toxiproxy.json"

    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro

    networks:
      - chaos_net

    ports:
      - "8474:8474"
      - "8443:8443"

    restart: unless-stopped

    depends_on:
      fake-gemini:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 2s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fake-gemini:
    build:
      context: .
      dockerfile: Dockerfile.fake

    networks:
      - chaos_net

    expose:
      - "8000"

    ports:
      - "8000:8000"

    restart: unless-stopped
    init: true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 2s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chaos_net:
    driver: bridge

volumes:
  sqlite_data:
  hf_models_cache:
  torch_cache:
  tectonic_cache: