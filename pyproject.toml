[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-pdf"
version = "0.1.0"
description = "SOTA PDF Translator with Hexagonal Pipeline and FSM Resilience"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "fastapi",
    "docker",
    "requests",
    "groq",
    "google-generativeai",
    "aiosqlite",
    "pymupdf",
    "pymupdf4llm",
    "pytesseract",
    "pillow",
    "python-dotenv",
    "numpy",
    "scipy",
    "pylatexenc",
    "psutil",
    "docling",
    "beautifulsoup4",
    "tiktoken",
    "apted",
    "libcst",
    "markdown-it-py",
    "tenacity"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pyright>=1.1",
    "import-linter>=1.9",
    "coverage>=7.3",
    "hypothesis>=6.100",
]

[project.scripts]
translator-pdf = "apps.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "infra*", "runtime*"]
namespaces = true

# ─────────────────────────────────────────────────────────────────────────────
# PYTEST CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "regression: Regression gate tests (golden corpus, snapshots) — NADR-10",
    "integration: Integration tests requiring real PDFs",
    "unit: Pure unit tests with no I/O",
    "smoke: Smoke tests for CI fast-path",
]

# ─────────────────────────────────────────────────────────────────────────────
# PYRIGHT (Static Type Checking)
# ─────────────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["core", "apps", "infra", "runtime"]
exclude = ["tests", "tools", "graveyard", "experiments"]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"

# ─────────────────────────────────────────────────────────────────────────────
# IMPORT-LINTER (Hexagonal Boundary Contracts)
#
# NOTA NADR-10 §5.3 R10: Los contratos que prohíben fitz/pymupdf NO se activan
# hasta que core/ast/parser.py (legacy) sea eliminado en Gate 2, Task 2.2.3.
# Activarlos ahora rompería el CI contra código legacy aún existente.
# ─────────────────────────────────────────────────────────────────────────────

[tool.importlinter]
root_packages = ["core", "apps", "infra", "runtime"]

# Activo desde Wave 1.1: frontera Domain → Infrastructure
[[tool.importlinter.contracts]]
name = "Domain must not import from Infrastructure"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["infra", "apps"]
ignore_imports = [
    # DEUDA TÉCNICA PRE-EXISTENTE (Gate 3-4): DF-06
    "core.benchmark.__main__ -> apps.bootstrap.pipeline_factory",
    "core.compiler.service -> apps.compiler.tex_builder",
    "core.execution.handlers -> infra.db.fsm_repository",
    "core.pipeline.state_store -> infra.db.fsm_repository",
    # TRANSICIONAL (Gate 2): core/extraction/ocr_providers aún vive en core.
    # Se eliminará cuando los providers migren a infra/ (DF-11).
    "core.extraction.ocr_providers.pymupdf_provider -> core.extraction.provider",
    "core.extraction.ocr_providers.docling_provider -> core.extraction.provider",
    "core.extraction.ocr_providers.tesseract_provider -> core.extraction.provider",
]

# Activo desde Wave 1.1: frontera Infrastructure → Application
[[tool.importlinter.contracts]]
name = "Infrastructure must not import from Application layer"
type = "forbidden"
source_modules = ["infra"]
forbidden_modules = ["apps"]

# NUEVO (Gate 2 — Task 2.2.3): Protección del dominio contra implementaciones OCR
[[tool.importlinter.contracts]]
name = "Domain modules must not import concrete OCR provider implementations"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "core.extraction.ocr_providers",
    "fitz",
    "pymupdf",
    "pymupdf4llm",
    "pytesseract",
    "docling",
    "PIL",
]
ignore_imports = [
    # Los providers mismos necesitan importar su paquete base (transicional hasta DF-11)
    "core.extraction.ocr_providers.pymupdf_provider -> core.extraction.ocr_providers",
    "core.extraction.ocr_providers.docling_provider -> core.extraction.ocr_providers",
    "core.extraction.ocr_providers.tesseract_provider -> core.extraction.ocr_providers",
]

# ─────────────────────────────────────────────────────────────────────────────
# COVERAGE
# ─────────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["core", "infra", "runtime"]
omit = ["tests/*", "tools/*", "graveyard/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true