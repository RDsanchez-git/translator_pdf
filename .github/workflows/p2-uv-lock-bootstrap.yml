name: P2 uv lock bootstrap (temporary)
on:
  pull_request:
    branches: [pdf-pdf-product-readiness]

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.10.0'
      - name: Resolve and export uv.lock
        run: |
          uv lock --python 3.11
          uv lock --check
          echo UV_LOCK_BEGIN
          cat uv.lock
          echo UV_LOCK_END
          echo UV_LOCK_BYTES
          wc -c < uv.lock
          sha256sum uv.lock
