name: CI — Required Status Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, pipeline_stabilization, pdf-pdf-product-readiness]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  static-analysis:
    name: Static Analysis (pyright + import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv (locked CI environment)
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --no-editable --no-python-downloads --python "$(command -v python)"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip list --python .venv/bin/python

      # pyrightconfig.json: único alcance efectivo core/apps/infra/runtime,
      # Python 3.11 Linux, modo standard. Strict queda fuera de este PR.
      - name: Type check (pyright; Linux standard)
        run: pyright

      - name: Architecture contract (import-linter)
        run: lint-imports --config pyproject.toml

  unit-tests:
    name: Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv (locked CI environment)
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --no-python-downloads --python "$(command -v python)"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run unit tests (pytest marker)
        run: |
          python -m pytest -m "unit" -v --tb=short --no-header -x

  integration-tests:
    name: Integration Test Suite
    runs-on: ubuntu-latest
    # Los tres jobs son controles independientes y obligatorios.
    # SMOKE científico corre aparte en continuous-verification.yml y es
    # informativo durante Fase 6 (ENFORCEMENT_CONTRACT §3).
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv (locked CI environment)
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --no-python-downloads --python "$(command -v python)"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # B03 uses loopback HTTP and temporary SQLite, so these are not pure unit tests.
      # This step runs without Docker containers, model credentials, or real PDF corpus.
      - name: Verify B03 offline fake and lab contracts (no Docker / LLM)
        run: |
          python -m pytest tests/unit/test_b031_g3_reusable_fake.py tests/unit/test_b032_offline_pdf_lab.py -q -ra

      # W06/G3 tests use disposable SQLite and fake providers, not real egress.
      # They have no pytest "integration" marker, so run them explicitly.
      - name: Verify W06-R1 uncertain-effect recovery offline (no Docker / LLM)
        run: |
          python -m pytest \
            tests/integration/test_w06_g3_uncertain_effect_offline.py \
            tests/integration/test_g3_b4_9_reconciler_fencing.py \
            tests/integration/test_g3_b4_8_preserve_engine.py \
            tests/integration/test_g3_b4_3a_engine_staging.py \
            tests/integration/test_g3_b4_3b_publication_recovery.py \
            -q -ra

      # W08-2b: durable context witnesses use only disposable SQLite / synthetic AST.
      # This step does not activate the adapter in production or authorize LLM egress.
      - name: Verify W08-2b durable context snapshots offline
        run: |
          python -m pytest tests/integration/test_w08_durable_context_boundary.py -q -ra

      # W08-2c: cross-process OCR/G3 context without paid providers or PDFs.
      - name: Verify W08-2c OCR and G3 context wiring offline
        run: |
          python -m pytest \
            tests/integration/test_w08_ocr_g3_context_wiring.py \
            tests/integration/test_g3_b4_2_ocr_router_durable_plan.py \
            -q -ra

      # These G3/G5 offline regression witnesses predate pytest integration
      # markers. Run them explicitly so CI cannot silently omit their guards.
      - name: Verify G3 quota threads and G5 fenced publication offline
        run: |
          python -m pytest \
            tests/integration/test_g3_b4_7b_sqlite_quota_thread_owner.py \
            tests/integration/test_g5_assembler_worker_integration.py \
            -q -ra

      - name: Run integration tests (pytest marker, excluding regression)
        run: |
          python -m pytest -m "integration and not regression" -v --tb=short --no-header

      # W4.2: real native compiler for synthetic PDF only. Match the
      # existing Dockerfile version; do not invoke commercial inference.
      # A missing binary or failed compile is a failing required check.
      - name: Install Tectonic for PPPR physical PDF witness
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          curl --fail --show-error --silent --location --retry 3 \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz \
            -o "$work/tectonic.tar.gz"
          tar -xzf "$work/tectonic.tar.gz" -C "$work"
          mkdir -p "$RUNNER_TEMP/pppr-tectonic-bin"
          install -m 0755 "$work/tectonic" "$RUNNER_TEMP/pppr-tectonic-bin/tectonic"
          "$RUNNER_TEMP/pppr-tectonic-bin/tectonic" --version
          # Prime the package cache with fixed synthetic TeX, not user data.
          # This installation/bootstrap may fetch public TeX dependencies.
          printf '%s\n' '\documentclass[11pt,a4paper]{article}' \
            '\usepackage{amsmath,amssymb,graphicx,hyperref}' \
            '\begin{document}' '\section*{Muestras} Test $x^2+1$.' \
            '\begin{figure}[htbp]\rule{1cm}{1cm}\end{figure}' \
            '\end{document}' > "$work/prime.tex"
          (cd "$work" && "$RUNNER_TEMP/pppr-tectonic-bin/tectonic" --untrusted prime.tex)
          test -s "$work/prime.pdf"
          rm -rf "$work"

      - name: Verify PPPR Gate 4 real physical synthetic PDF (no paid inference)
        env:
          PPPR_G4_REQUIRE_PHYSICAL_PDF: "1"
        run: |
          export PATH="$RUNNER_TEMP/pppr-tectonic-bin:$PATH"
          python -m pytest tests/integration/test_pppr_g4_physical_pdf.py -v --tb=short --no-header -ra

      # Audit all technical tests, including older unmarked fixtures. The
      # corpus-backed E2E tests run only when explicitly requested; CV remains
      # a separate, visible gate with no reinterpretation of its verdict.
      - name: Run complete technical pytest suite (excluding scientific E2E)
        run: |
          python -m pytest -m "not e2e" -q -ra